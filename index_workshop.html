<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pendaftaran Workshop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Form Pendaftaran Workshop</h2>
        <p class="subtitle">Isi formulir di bawah ini untuk mendaftar sesi workshop.</p>

        <!-- Pesan Sukses / Error Global -->
        <div id="alertBox" class="alert hidden"></div>

        <form id="workshopForm">
            <!-- Input Nama -->
            <div class="form-group">
                <label for="nama">Nama Lengkap *</label>
                <input type="text" id="nama" placeholder="Masukkan nama lengkap" required>
                <div class="info-row">
                    <small class="error-text" id="namaError"></small>
                    <small class="char-count"><span id="charCount">0</span>/50 karakter</small>
                </div>
            </div>

            <!-- Input Email -->
            <div class="form-group">
                <label for="email">Alamat Email *</label>
                <input type="email" id="email" placeholder="contoh@email.com" required>
                <small class="error-text" id="emailError"></small>
            </div>

            <!-- Pilihan Sesi -->
            <div class="form-group">
                <label for="sesi">Pilih Sesi Workshop *</label>
                <select id="sesi" required>
                    <option value="">-- Pilih Sesi --</option>
                    <option value="Web Development Basic">Web Development Basic (09:00 - 12:00)</option>
                    <option value="UI/UX Design Essentials">UI/UX Design Essentials (13:00 - 15:00)</option>
                    <option value="Advanced JavaScript & DOM">Advanced JavaScript & DOM (15:30 - 17:30)</option>
                </select>
                <small class="error-text" id="sesiError"></small>
            </div>

            <!-- Ringkasan Input Live -->
            <div class="summary-box">
                <h4>Ringkasan Pendaftaran:</h4>
                <p><strong>Nama:</strong> <span id="summaryNama">-</span></p>
                <p><strong>Email:</strong> <span id="summaryEmail">-</span></p>
                <p><strong>Sesi:</strong> <span id="summarySesi">-</span></p>
            </div>

            <!-- Tombol Action -->
            <div class="button-group">
                <button type="submit" id="btnSubmit">Daftar Sekarang</button>
                <button type="button" id="btnReset" class="btn-reset">Reset Input</button>
            </div>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
